name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: minikube image build -t portfolio .
      - run: kubectl apply -f k8s.yaml
      - run: kubectl rollout restart deployment portfolio
      - run: kubectl rollout status deployment portfolio --timeout=180s
